<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education & Certifications</title>
    <style>
        /* Responsive iframe styling */
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Education & Certifications</h1>
    <div class="iframe-container">
        <iframe src="https://tryhackme.com/badge/123456" frameborder="0" allowfullscreen></iframe>
    </div>
</body>
</html>
